<footer class="site-footer">
  <div class="wrap {% if wide %}wrap--wide{% endif %} site-footer__inner">
    <div class="site-footer__credit">
      <p class="site-footer__name">© {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
      <p class="site-footer__built">Made in Munich with <span class="emoji">☕️</span> <span class="emoji">🥨</span>, <a href="https://claude.ai" rel="noopener">Claude</a> and <a href="https://jekyllrb.com" rel="noopener">Jekyll</a></p>
    </div>
    <nav class="site-footer__links" aria-label="Elsewhere">
      <a href="https://github.com/{{ site.handles.github }}" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.handles.linkedin }}/" rel="noopener">LinkedIn</a>
      <a href="https://instagram.com/{{ site.handles.instagram }}" rel="noopener">Instagram</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</footer>
