<footer class="site-footer">
  <div class="wrap {% if wide %}wrap--wide{% endif %} site-footer__inner">
    <span class="site-footer__credit mono">
      <span>© {{ 'now' | date: "%Y" }} {{ site.author.name }}</span>
      <span class="site-footer__built">made in Munich <span class="emoji">☕️</span> <span class="emoji">🥨</span> <a href="https://claude.ai" rel="noopener">Claude</a> &amp; <a href="https://jekyllrb.com" rel="noopener">Jekyll</a></span>
    </span>
    <span class="site-footer__links mono">
      <a href="https://github.com/{{ site.handles.github }}" rel="noopener">github</a>
      <a href="https://www.linkedin.com/in/{{ site.handles.linkedin }}/" rel="noopener">linkedin</a>
      <a href="https://instagram.com/{{ site.handles.instagram }}" rel="noopener">instagram</a>
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    </span>
  </div>
</footer>
