<header class="site-header">
  <div class="wrap {% if wide %}wrap--wide{% endif %} site-header__inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <canvas class="mesh logo__mark" aria-hidden="true"></canvas>
      <span>raincrash</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/about/' | relative_url }}" {% if section == "about" %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/blog/' | relative_url }}" {% if section == "blog" %}aria-current="page"{% endif %}>Musings</a>
      <a href="{{ '/photography/' | relative_url }}" {% if section == "photography" %}aria-current="page"{% endif %}>Photography</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>
