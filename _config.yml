# ─── Site ──────────────────────────────────────────────────────────────
title: Sricharan Chiruvolu
tagline: AI Research Lead · Generative AI, Computer Vision & 3D
description: >-
  AI Research Lead in Munich working on generative AI, computer vision and 3D.
  Notes on machine learning and geometry; photography on film and digital.
url: "https://sric.me"
baseurl: ""
lang: en
timezone: Europe/Berlin

author:
  name: Sricharan Chiruvolu
  email: sricharanchiruvolu@googlemail.com
  avatar: https://avatars.githubusercontent.com/u/9132273?v=4
  url: https://sric.me/about/
  # Used in the structured-data profile on Home and About (_includes/person-jsonld.html).
  job_title: AI Research Lead
  works_for: { name: Beyond Presence, url: "https://www.beyondpresence.ai" }
  alumni_of: { name: Technical University of Munich, url: "https://www.tum.de" }
  city: Munich
  country: DE
  knows_about: [Generative AI, Computer Vision, 3D Reconstruction, 3D Gaussian Splatting, Digital Humans, Diffusion Models, Photography]

# Usernames, used to build links in the templates.
handles:
  github: raincrash
  linkedin: sricharanchiruvolu
  instagram: shots.by.sri

# ─── SEO (jekyll-seo-tag) ──────────────────────────────────────────────
# Profiles that are "you" in Google's eyes (JSON-LD sameAs).
social:
  name: Sricharan Chiruvolu
  links:
    - https://github.com/raincrash
    - https://www.linkedin.com/in/sricharanchiruvolu/
    - https://www.instagram.com/shots.by.sri/
logo: /assets/og/logo.png          # square image for structured data
twitter:
  card: summary_large_image        # big preview cards on X, Slack, LinkedIn…
# Paste your Search Console / Bing verification codes here when you have them:
# webmaster_verifications:
#   google: XXXXXXXX
#   bing: XXXXXXXX

# ─── Blog ──────────────────────────────────────────────────────────────
permalink: /:title/
paginate: 8
paginate_path: /blog/page:num/

# ─── Build ─────────────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax   # emits \( \) / \[ \] which KaTeX renders client-side
  syntax_highlighter: rouge
  hard_wrap: false

sass:
  sass_dir: _sass
  style: compressed

theme: null   # no gem theme; everything lives in this repo

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      math: true
      image: /assets/og/default.png
  - scope: { path: "" }
    values:
      layout: page
      image: /assets/og/default.png
  - scope: { path: "photography" }
    values:
      image: /assets/og/photography.jpg

exclude:
  - README.md
  - CLAUDE.md
  - LICENSE.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - bin/
  - vendor/
  - .claude/
  - .bundle/
