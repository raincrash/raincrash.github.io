---
layout: default
---

<style>
  .trip-back {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #999;
    text-decoration: none;
    margin-bottom: 1.2rem;
    transition: color 0.15s;
  }

  .trip-back:hover { color: #111; text-decoration: none; }

  .trip-page-title {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 0 0 1.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid #e8e8e8;
  }

  /* Style the description paragraph that precedes the photo grid */
  .trip-content > p:first-of-type {
    color: #555;
    font-size: 0.95rem;
    line-height: 1.7;
    max-width: 580px;
    margin-bottom: 0;
  }

  .trip-content > p:first-of-type a {
    color: #333;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
</style>

<a class="trip-back" href="{{ site.baseurl }}/photography">← Photography</a>
<h1 class="trip-page-title">{{ page.title }}</h1>
<div class="trip-content">
  {{ content }}
</div>
